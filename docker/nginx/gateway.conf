upstream feibao_backend {
    server backend:3003;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 首页聚合接口：只允许 ETag 协商，禁止强制缓存
    # 这些接口含新闻/轮播/风采等后台可随时发布的内容。此前用 max-age=30 + stale-while-revalidate=60，
    # 浏览器在最多约 90 秒内会继续复用旧响应，表现为「后台已发布、前台看不到，必须强刷或清缓存」。
    # 改为 no-cache：浏览器仍可缓存，但每次请求都带 If-None-Match 校验，内容未变返回 304（几十字节），
    # 内容一变立即拿到新数据，兼顾实时性与带宽。
    location ~ ^/api/(home/|videos/|config/?$) {
        proxy_pass http://feibao_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://feibao_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://feibao_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept $http_accept;
    }

    location /_AMapService/ {
        proxy_pass http://feibao_backend/_AMapService/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台（www.scfb.org.cn/admin/）
    location = /admin/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 官网首页与静态资源
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
