# Static cache rules for the Sichuan Feibao website.
# Include these locations in the production server block that serves website/dist.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

location = /index.html {
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}

location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf)$ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

location / {
  try_files $uri $uri/ /index.html;
}
