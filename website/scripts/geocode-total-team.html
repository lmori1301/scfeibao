<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Total Team Geocoder</title>
</head>
<body>
  <pre id="output">loading...</pre>
  <script>
    const AMAP_KEY = 'e2f3c362950ac5d432a489b7f74e16cf'
    window._AMapSecurityConfig = {
      securityJsCode: '89a3e2583feec1c50c910b5e8518451e',
    }

    const queries = [
      '四川省成都市温江区S8(成名高速) 四川飞豹救援总队指挥中心',
      '四川省成都市温江区凤凰北大街 四川飞豹救援总队指挥中心',
      '四川省成都市温江区凤凰立交 四川飞豹救援总队指挥中心',
      '四川省成都市温江区成名高速凤凰立交 四川飞豹救援总队指挥中心',
      '四川省成都市温江区凤溪大道 四川飞豹救援总队指挥中心',
      '四川省成都市温江区凤凰北大街 四川飞豹突击应急救援总队',
      '四川省成都市温江区成名高速凤凰立交 四川飞豹突击应急救援总队',
      '四川省成都市温江区四川飞豹突击应急救援总队',
    ]

    const output = document.getElementById('output')

    function setOutput(value) {
      output.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2)
    }

    function loadAmap() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script')
        script.src = `https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}&plugin=AMap.Geocoder`
        script.onload = () => resolve(window.AMap)
        script.onerror = () => reject(new Error('amap script load failed'))
        document.head.appendChild(script)
      })
    }

    async function run() {
      try {
        const AMap = await loadAmap()
        const geocoder = new AMap.Geocoder({ city: '成都', extensions: 'all' })
        const results = []

        for (const query of queries) {
          const result = await new Promise((resolve) => {
            const timer = window.setTimeout(() => {
              resolve({ query, status: 'timeout' })
            }, 8000)

            geocoder.getLocation(query, (status, payload) => {
              window.clearTimeout(timer)
              const geocodes = payload?.geocodes || []
              resolve({
                query,
                status,
                geocodes: geocodes.slice(0, 3).map((item) => ({
                  formattedAddress: item.formattedAddress || null,
                  level: item.level || null,
                  location: item.location
                    ? { lng: Number(item.location.lng), lat: Number(item.location.lat) }
                    : null,
                  district: item.district || null,
                  township: item.township || null,
                  neighborhood: item.neighborhood || null,
                  building: item.building || null,
                })),
              })
            })
          })

          results.push(result)
          setOutput(results)
        }
      } catch (error) {
        setOutput({ error: String(error && error.message ? error.message : error) })
      }
    }

    run()
  </script>
</body>
</html>
